        name: Memoisation
        default_effort_hours: 8
        prerequisites:
          - recursion-fundamentals

      - code: tabulation
        name: Tabulation
        default_effort_hours: 8
        prerequisites:
          - memoisation

      - code: dp-on-subsequences
        name: Dynamic Programming on Subsequences
        default_effort_hours: 12
        prerequisites:
          - tabulation

      - code: dp-on-grids
        name: Dynamic Programming on Grids
        default_effort_hours: 10
        prerequisites:
          - tabulation
