# Placefy, locally. Run from the repository root:
#
#   docker compose -f ops/docker-compose.yml up --build
#
# Requires ops/.env (see ops/.env.example). Compose reads it automatically because it sits
# next to this file.

name: placefy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: placefy
      POSTGRES_USER: placefy
      POSTGRES_PASSWORD: placefy
    ports:
      # Exposed so `./gradlew bootRun` outside Docker can reach the same database.
      # Host ports are overridable because 5432 and 8080 are commonly already taken by
      # something else on a developer machine, and a port clash should be a one-line fix in
      # ops/.env rather than an edit to a committed file.
      - "${PLACEFY_DB_PORT:-5432}:5432"
    volumes:
      - placefy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend waits for this. Without it Flyway races the database's own startup and the
      # first `up` on a clean machine fails for a reason that looks like a code problem.
      test: ["CMD-SHELL", "pg_isready -U placefy -d placefy"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: ops/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      PLACEFY_DB_URL: jdbc:postgresql://postgres:5432/placefy
      PLACEFY_DB_USER: placefy
      PLACEFY_DB_PASSWORD: placefy
      # No default. The application refuses to start without it, which is the intended
      # behaviour: a committed fallback signing key is the same as no signature at all.
      PLACEFY_JWT_SECRET: ${PLACEFY_JWT_SECRET:?set PLACEFY_JWT_SECRET in ops/.env - see ops/.env.example}
      PLACEFY_CORS_ALLOWED_ORIGINS: http://localhost:${PLACEFY_WEB_PORT:-5173}
      # The `local` profile turns seeding on; this is where the copied content lives in the
      # image. Re-importing identical content is a no-op, so restarts are cheap and safe.
      PLACEFY_TAXONOMY_PATH: /app/content/taxonomy
    ports:
      - "${PLACEFY_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: ops/frontend.Dockerfile
      args:
        # Baked in at build time: Vite resolves import.meta.env when it bundles, not at runtime.
        VITE_API_BASE_URL: http://localhost:${PLACEFY_API_PORT:-8080}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 5173 matches the Vite dev-server port, so the backend's allowed CORS origin is the same
      # whether the frontend is running in Docker or from `npm run dev`.
      - "${PLACEFY_WEB_PORT:-5173}:80"

volumes:
  placefy-postgres-data:
