server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is client-routed. Any path that is not a real file is the SPA's to resolve, so a
    # deep link such as /dashboard must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # Vite fingerprints these filenames, so a long cache is safe and a new build busts it.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
