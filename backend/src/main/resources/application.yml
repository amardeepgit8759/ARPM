spring:
  application:
    name: placefy

  datasource:
    url: ${PLACEFY_DB_URL:jdbc:postgresql://localhost:5432/placefy}
    username: ${PLACEFY_DB_USER:placefy}
    password: ${PLACEFY_DB_PASSWORD:placefy}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate is never allowed to alter it, so a mapping that has
      # drifted from the migrations fails loudly instead of silently reshaping the database.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PLACEFY_PORT:8080}
  error:
    # Errors are produced by the RFC 7807 advice; the servlet container's default page never runs.
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # Only health. Everything else stays off until there is a reason and an access decision.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

placefy:
  security:
    jwt:
      # No default, on purpose. A committed fallback secret is the same as no signature at all.
      secret: ${PLACEFY_JWT_SECRET}
      issuer: placefy
      access-token-ttl: PT15M
    refresh-token:
      ttl: P30D
    cors:
      allowed-origins: ${PLACEFY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  taxonomy:
    seed:
      # Off by default. A deployment that reseeds content on every boot is convenient locally
      # and surprising in production, so switching it on is always a deliberate act.
      enabled: ${PLACEFY_TAXONOMY_SEED_ENABLED:false}
      path: ${PLACEFY_TAXONOMY_PATH:../content/taxonomy}
      publish: ${PLACEFY_TAXONOMY_SEED_PUBLISH:false}
  web:
    refresh-cookie:
      name: placefy_refresh
      secure: true
      # Scoped to the auth endpoints — refresh and logout read it — so it is not attached to
      # every API call. Register and login receive it too, and ignore it.
      path: /api/v1/auth
      same-site: Strict

logging:
  level:
    org.springframework.security: INFO

---
# Local development over plain HTTP. Activated by docker compose and by `bootRun`.
spring:
  config:
    activate:
      on-profile: local

placefy:
  taxonomy:
    seed:
      # Local development gets a populated, published taxonomy from one `docker compose up`.
      enabled: true
      publish: true
  web:
    refresh-cookie:
      # A Secure cookie is never sent over http://localhost, so local dev could not log in at all.
      # This is the only place the flag is false, and the profile is never used in a deployment.
      secure: false
