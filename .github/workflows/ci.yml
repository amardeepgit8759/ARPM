name: CI

# GitHub only reads workflows from .github/workflows, which is why this file is not in ops/
# alongside the rest of the operational configuration.

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      # Split from the unit suite so a broken architecture rule is legible in the job list
      # rather than buried among a hundred passing tests.
      - name: Architecture rules
        run: ./gradlew test --tests '*ArchitectureRulesTest*' --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # The runner provides a Docker daemon, so Testcontainers starts a real PostgreSQL and the
      # migrations run exactly as they do locally. No in-memory database stands in for it.
      - name: Integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  compose:
    name: Docker Compose boots
    runs-on: ubuntu-latest
    # The exit criterion for Phase 0 is that a clean machine can bring the stack up. That is
    # worth asserting in CI rather than trusting, because it breaks silently and is only ever
    # discovered by whoever joins the project next.
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway signing secret
        run: echo "PLACEFY_JWT_SECRET=$(openssl rand -base64 48)" > ops/.env

      - name: Bring the stack up
        run: docker compose -f ops/docker-compose.yml up --build --wait --wait-timeout 300

      - name: Register a user through the API
        run: |
          curl --fail --silent --show-error \
            -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Smoke","email":"ci-smoke@example.com","password":"correct-horse-battery"}' \
            | tee /dev/stderr | grep -q '"role":"STUDENT"'

      - name: Check the frontend is served
        run: curl --fail --silent --show-error http://localhost:5173 | grep -q '<div id="root">'

      - name: Show logs on failure
        if: failure()
        run: docker compose -f ops/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f ops/docker-compose.yml down -v

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan what was pushed, not just the tip. A secret committed
          # three commits ago and force-pushed past a shallow clone is still a leaked secret.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-check:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Without a key the NVD either throttles the run to hours or, worse, analyses an empty
      # database and reports no vulnerabilities at all. Failing here is deliberate: a scan that
      # silently finds nothing is more dangerous than no scan, because it looks like a pass.
      - name: Require an NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY is not set. Request a free key at"
            echo "::error::https://nvd.nist.gov/developers/request-an-api-key and add it as a"
            echo "::error::repository secret. Without it this scan cannot be trusted."
            exit 1
          fi

      - name: Cache the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-${{ runner.os }}-

      - name: Scan runtime dependencies
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check/
